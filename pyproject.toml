[project]
name = "reclaim-livetwin"
version = "0.0.0"
description = "RECLAIM Live Twin gateway and advisory predictive-engine source tree"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=1.24",
  "paho-mqtt>=1.6,<2.0",
  "pyyaml>=6.0",
  "requests>=2.31",
  "scipy>=1.10",
]

[project.optional-dependencies]
model = ["scikit-learn>=1.3"]
tdms = ["nptdms>=1.7"]

[dependency-groups]
dev = ["pytest>=7.0,<10"]

[tool.uv]
package = false
required-version = ">=0.11.21,<0.12"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
